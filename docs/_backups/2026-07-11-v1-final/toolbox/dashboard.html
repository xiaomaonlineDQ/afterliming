<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>工具箱 · 黎明之后</title>
<link rel="stylesheet" href="../css/main.css?v=2026071116">
<style>
/* ========== Dashboard Layout ========== */
:root {
  --db-header-h: 44px;
  --db-tabs-h: 40px;
  --db-status-h: 32px;
}
.db-page {
  height: 100vh; height: 100dvh;
  overflow: hidden;
  background: var(--bg-surface);
  display: flex; flex-direction: column;
}

/* ── Header ── */
.db-header {
  background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);
  padding: 0 var(--space-md); height: var(--db-header-h); min-height: var(--db-header-h);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; z-index: 100;
}
.db-header h1 { font-size: 0.95rem; margin: 0; display: flex; align-items: center; gap: 6px; }
.db-header h1 span { font-weight: 300; color: var(--text-muted); }

.db-mode-area { display: flex; align-items: center; gap: 8px; }
.db-mode-badge {
  font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 10px;
  white-space: nowrap;
}
.db-mode-badge.player { background: rgba(46,134,193,0.15); color: var(--color-counter-glow); border: 1px solid rgba(46,134,193,0.3); }
.db-mode-badge.mayor { background: rgba(192,57,43,0.15); color: var(--color-whisper-glow); border: 1px solid rgba(192,57,43,0.3); }
.db-mode-btn {
  font-size: 0.68rem; padding: 3px 10px; border-radius: 8px;
  border: 1px solid var(--border-medium); background: var(--bg-base);
  color: var(--text-secondary); cursor: pointer; white-space: nowrap;
}
.db-mode-btn:hover { border-color: var(--color-whisper); color: var(--color-whisper-glow); }

/* ── Tabs ── */
.db-tabs {
  background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);
  display: flex; height: var(--db-tabs-h); min-height: var(--db-tabs-h);
  flex-shrink: 0; overflow-x: auto; padding: 0 4px;
}
.db-tab {
  padding: 0 14px; font-size: 0.78rem; font-weight: 600; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  white-space: nowrap; border-bottom: 2px solid transparent;
  transition: all 0.15s; display: flex; align-items: center; gap: 4px;
}
.db-tab:hover { color: var(--text-secondary); }
.db-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.db-tab.mayor-tab { color: var(--color-whisper); }
.db-tab.mayor-tab.active { border-bottom-color: var(--color-whisper); }
.db-tab.hidden { display: none !important; }

/* ── Content ── */
.db-content {
  flex: 1; height: 0; min-height: 0; overflow: hidden; position: relative;
}
.db-module {
  display: none; position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
}
.db-module.active { display: flex; flex-direction: column; }

/* ── Status Bar ── */
.db-statusbar {
  background: var(--bg-surface); border-top: 1px solid var(--border-subtle);
  height: var(--db-status-h); min-height: var(--db-status-h);
  display: flex; align-items: center; padding: 0 var(--space-md);
  gap: var(--space-lg); flex-shrink: 0; z-index: 100;
}
.db-statusbar .stat-item {
  font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; gap: 4px;
}
.stat-item .stat-val { color: var(--color-primary); }
.stat-item .stat-label { color: var(--text-muted); }

/* ── Map & Daily Modules (iframe embed) ── */
#mod-map, #mod-daily { padding: 0; }
#mod-map iframe, #mod-daily iframe { width: 100%; height: 100%; border: none; display: block; }
.sim-result-box.done { color: var(--text-primary); }

/* ── Rule Board Module ── */
.rb-mod-inner { display: flex; flex: 1; height: 0; min-height: 0; overflow: hidden; }

.rb-pool-panel {
  width: 280px; min-width: 220px; max-width: 320px;
  background: var(--bg-elevated); border-right: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; overflow: hidden;
}
.rb-pool-header {
  padding: 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.rb-pool-header h3 { font-size: 0.82rem; margin: 0 0 4px; }
.rb-pool-tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.rb-pool-tab {
  padding: 2px 6px; font-size: 0.62rem; border: 1px solid var(--border-medium);
  border-radius: 3px; background: var(--bg-base); color: var(--text-secondary); cursor: pointer; white-space: nowrap;
}
.rb-pool-tab.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.rb-pool-cards {
  flex: 1; height: 0; min-height: 0; overflow-y: auto; padding: 4px;
  display: flex; flex-direction: column; gap: 3px;
}

.rb-card-item {
  display: flex; align-items: center; gap: 4px;
  background: var(--bg-card); border: 2px solid var(--border-subtle); border-radius: 4px;
  padding: 2px; cursor: pointer; transition: all 0.15s; user-select: none;
}
.rb-card-item:hover { border-color: var(--border-medium); }
.rb-card-item.selected { border-color: var(--color-primary) !important; }
.rb-card-item.rb-draggable { cursor: grab; }
.rb-card-item.rb-draggable:active { cursor: grabbing; }
.rb-card-item .rbci-img { width: 90px; height: 32px; flex-shrink: 0; border-radius: 2px; overflow: hidden; background: var(--bg-base); }
.rb-card-item .rbci-img img { width: 100%; height: 100%; object-fit: cover; }
.rb-card-item .rbci-name { font-size: 0.7rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }

.rb-board-panel {
  flex: 1; min-width: 0; display: grid;
  grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: 6px; padding: 6px; overflow: hidden;
}
.rb-zone {
  background: var(--bg-card); border: 2px solid var(--border-subtle); border-radius: var(--radius-md);
  display: flex; flex-direction: column; overflow: hidden;
}
.rb-zone.rb-drop-target { border-style: dashed; border-color: var(--color-primary); }
.rb-zone h4 {
  font-size: 0.7rem; padding: 4px 8px; margin: 0; flex-shrink: 0;
  text-align: center; border-bottom: 1px solid var(--border-subtle);
}
.rb-zone-all h4 { background: rgba(231,76,60,0.12); color: #e74c3c; }
.rb-zone-human h4 { background: rgba(52,152,219,0.12); color: #3498db; }
.rb-zone-ghost h4 { background: rgba(155,89,182,0.12); color: #9b59b6; }
.rb-zone-erased h4 { background: rgba(127,140,141,0.12); color: #7f8c8d; }
.rb-zone-cards {
  flex: 1; height: 0; min-height: 0; overflow-y: auto; padding: 4px;
  display: flex; flex-direction: column; gap: 3px;
}
.rb-zone-cards .empty-hint {
  color: var(--text-muted); font-size: 0.65rem; text-align: center; padding: var(--space-lg);
}
.rb-zone-card {
  cursor: pointer; border: 1px solid var(--border-subtle); border-radius: 4px;
  overflow: hidden; background: var(--bg-base); position: relative; flex-shrink: 0;
}
.rb-zone-card img { width: 100%; height: auto; display: block; aspect-ratio: 2640/930; object-fit: contain; }
.rb-zone-card .zcard-return {
  position: absolute; top: 4px; right: 4px; font-size: 0.6rem; color: #fff;
  background: rgba(231,76,60,0.85); cursor: pointer; padding: 1px 6px; border-radius: 4px;
  border: none; display: none; z-index: 5;
}
.rb-zone-card .zcard-return.show { display: inline-block; }

/* ── Quick Dashboard Module ── */
.dash-mod-inner { padding: var(--space-md); flex: 1; overflow-y: auto; }
.dash-mod-inner h2 { font-size: 1rem; margin-bottom: var(--space-md); display: flex; align-items: center; gap: 6px; }

/* Stat cards row */
.dash-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-sm); margin-bottom: var(--space-lg); }
.dash-stat-card {
  background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  padding: var(--space-sm) var(--space-md); text-align: center;
}
.dash-stat-card .dsc-val { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
.dash-stat-card .dsc-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
.dash-stat-card.warn { border-color: var(--color-whisper); }
.dash-stat-card.warn .dsc-val { color: var(--color-whisper-glow); }
.dash-stat-card.info .dsc-val { color: var(--color-counter-glow); }
.dash-stat-card.gold .dsc-val { color: var(--color-rule-glow); }

/* Citizen roster */
.dash-section { margin-bottom: var(--space-lg); }
.dash-section h3 { font-size: 0.8rem; margin-bottom: var(--space-sm); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.dash-roster { display: flex; flex-wrap: wrap; gap: 6px; }
.dash-citizen-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600;
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.dash-citizen-tag.alive { border-color: rgba(46,134,193,0.3); color: var(--color-counter-glow); }
.dash-citizen-tag.ghost { border-color: rgba(192,57,43,0.3); color: var(--color-whisper-glow); background: rgba(192,57,43,0.06); }
.dash-citizen-tag.dead { border-color: #555; color: var(--text-muted); opacity: 0.55; text-decoration: line-through; }
.dash-citizen-tag .dct-stat { font-size: 0.58rem; opacity: 0.7; }

/* Quick links */
.dash-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-sm); }
.dash-link-card {
  display: flex; align-items: center; gap: 10px;
  padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  text-decoration: none; color: var(--text-primary); transition: all 0.15s; cursor: pointer;
}
.dash-link-card:hover { border-color: var(--color-primary); transform: translateY(-1px); }
.dash-link-card .dlc-icon { font-size: 1.4rem; flex-shrink: 0; }
.dash-link-card .dlc-info { flex: 1; }
.dash-link-card .dlc-title { font-size: 0.75rem; font-weight: 700; }
.dash-link-card .dlc-desc { font-size: 0.62rem; color: var(--text-muted); margin-top: 1px; }

/* ── Identity Overlay ── */
.id-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  animation: idFadeIn 0.3s ease;
}
@keyframes idFadeIn { from { opacity: 0; } to { opacity: 1; } }

.id-card {
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: 32px 28px;
  max-width: 520px; width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.id-card h2 { font-size: 1.2rem; margin: 0 0 4px; }
.id-card .id-subtitle { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 24px; }

.id-options {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 16px;
}
.id-option {
  background: var(--bg-card); border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 20px 12px;
  cursor: pointer; transition: all 0.2s ease;
  text-align: center;
}
.id-option:hover {
  border-color: var(--border-medium);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.id-option.id-mayor { border-left: 3px solid #f0a500; }
.id-option.id-mayor:hover { border-color: #f0a500; box-shadow: 0 8px 24px rgba(240,165,0,0.15); }
.id-option.id-reporter { border-left: 3px solid #20c997; }
.id-option.id-reporter:hover { border-color: #20c997; box-shadow: 0 8px 24px rgba(32,201,151,0.15); }
.id-option.id-sheriff { border-left: 3px solid #4dabf7; }
.id-option.id-sheriff:hover { border-color: #4dabf7; box-shadow: 0 8px 24px rgba(77,171,247,0.15); }

.id-option .ido-icon { font-size: 2.2rem; margin-bottom: 8px; display: block; }
.id-option .ido-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
.id-option .ido-desc { font-size: 0.62rem; color: var(--text-muted); line-height: 1.4; }
.id-option .ido-edition { font-size: 0.58rem; color: var(--text-muted); margin-top: 6px; opacity: 0.7; }

/* Identity switch hint */
.id-switch-hint {
  font-size: 0.6rem; color: var(--text-muted);
  margin-top: 8px; opacity: 0.5;
}

/* ── Dashboard dark theme enhancement ── */
.dash-mod-inner {
  color: var(--text-primary);
}
.dash-stat-card {
  background: var(--bg-elevated);
  border-color: rgba(255,255,255,0.06);
}
.dash-section h3 {
  color: var(--text-secondary);
}
.dash-citizen-tag {
  background: var(--bg-elevated);
  border-color: rgba(255,255,255,0.06);
}
.dash-link-card {
  background: var(--bg-elevated);
  border-color: rgba(255,255,255,0.06);
}
.dash-link-card:hover {
  background: var(--bg-card);
}

/* Settlement block dark */
.dash-settle-block {
  background: var(--bg-elevated) !important;
  border-color: rgba(255,255,255,0.06) !important;
}
.dash-end-block {
  background: rgba(192,57,43,0.08) !important;
  border-color: rgba(192,57,43,0.2) !important;
}

/* Dashboard empty state dark */
.dash-empty {
  color: var(--text-secondary);
}

/* ── Identity badge dynamic ── */
.db-mode-badge.id-mayor { background: rgba(240,165,0,0.15); color: #f0a500; border-color: rgba(240,165,0,0.3); }
.db-mode-badge.id-reporter { background: rgba(32,201,151,0.15); color: #20c997; border-color: rgba(32,201,151,0.3); }
.db-mode-badge.id-sheriff { background: rgba(77,171,247,0.15); color: #4dabf7; border-color: rgba(77,171,247,0.3); }

/* Game not started */
.dash-empty {
  text-align: center; padding: var(--space-xl); color: var(--text-muted);
}
.dash-empty .dash-empty-icon { font-size: 3rem; margin-bottom: var(--space-md); }
.dash-empty p { font-size: 0.78rem; margin-bottom: var(--space-md); }
.dash-empty .btn { font-size: 0.75rem; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .db-tab { font-size: 0.7rem; padding: 0 10px; }
  .panel-hand-area { grid-template-columns: 1fr; }
  .rb-pool-panel { width: 240px; min-width: 180px; }
  .rb-board-panel { grid-template-columns: 1fr 1fr; }
  /* map module now uses iframe */
  .dash-stat-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .rb-mod-inner { flex-direction: column; }
  .rb-pool-panel { width: 100%; max-width: none; height: 40%; min-height: 120px; border-right: none; border-bottom: 1px solid var(--border-subtle); }
  .rb-board-panel { height: 60%; grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body class="db-page">

<!-- ═══════════ HEADER ═══════════ -->
<header class="db-header">
  <a href="../index.html" style="color:var(--text-muted);text-decoration:none;font-size:0.82rem;flex-shrink:0;" title="返回首页">← 首页</a>
  <h1>🏙️ 黎明之后<span>· 工具箱</span></h1>
  <span class="db-mode-badge mayor" id="identityBadge" onclick="showIdentityPicker()" style="cursor:pointer;" title="点击切换身份">👑 市长端</span>
</header>

<!-- ═══════════ TABS ═══════════ -->
<nav class="db-tabs" id="dbTabs">
  <button class="db-tab active" data-tab="map">🗺️ 地图</button>
  <button class="db-tab" data-tab="rules">📋 公开规则板</button>
  <button class="db-tab" data-tab="daily">📰 市民日报</button>
  <button class="db-tab" data-tab="dash">📊 仪表盘</button>
</nav>

<!-- ═══════════ CONTENT ═══════════ -->
<main class="db-content">

  <!-- ── 地图模块 (iframe: 完整A市地图页面) ── -->
  <section class="db-module active" id="mod-map">
    <iframe src="../map.html" title="A市地图"></iframe>
  </section>

  <!-- ── 规则板模块 ── -->
  <section class="db-module" id="mod-rules">
    <div class="rb-mod-inner" id="rbModInner">
      <!-- Left: Card Pool -->
      <div class="rb-pool-panel" id="rbPoolPanel">
        <div class="rb-pool-header">
          <h3>📦 规则卡池 <span id="poolCount" style="font-size:0.65rem;color:var(--text-muted);">(54)</span></h3>
          <div class="rb-pool-tabs">
            <button class="rb-pool-tab active" data-filter="all">全部</button>
            <button class="rb-pool-tab" data-filter="普通">普通</button>
            <button class="rb-pool-tab" data-filter="特殊">特殊</button>
          </div>
        </div>
        <div class="rb-pool-cards" id="rbPoolCards"></div>
      </div>
      <!-- Right: Zone Board -->
      <div class="rb-board-panel" id="rbBoard">
        <div class="rb-zone rb-zone-all" data-zone="all">
          <h4>🌐 影响全体</h4>
          <div class="rb-zone-cards" id="zoneAll"><span class="empty-hint">拖入规则卡</span></div>
        </div>
        <div class="rb-zone rb-zone-human" data-zone="human">
          <h4>👤 只影响人</h4>
          <div class="rb-zone-cards" id="zoneHuman"><span class="empty-hint">拖入规则卡</span></div>
        </div>
        <div class="rb-zone rb-zone-ghost" data-zone="ghost">
          <h4>👻 只影响鬼</h4>
          <div class="rb-zone-cards" id="zoneGhost"><span class="empty-hint">拖入规则卡</span></div>
        </div>
        <div class="rb-zone rb-zone-erased" data-zone="erased">
          <h4>❌ 已被抹除</h4>
          <div class="rb-zone-cards" id="zoneErased"><span class="empty-hint">拖入规则卡</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── 市民日报模块 ── -->
  <section class="db-module" id="mod-daily">
    <iframe src="citizen-daily.html" title="市民日报"></iframe>
  </section>

  <!-- ── 快速仪表盘模块 ── -->
  <section class="db-module" id="mod-dash">
    <div class="dash-mod-inner" id="dashContent"></div>
  </section>

</main>

<!-- ═══════════ STATUS BAR ═══════════ -->
<footer class="db-statusbar">
  <span class="stat-item">📅 <span class="stat-label">回合</span> <span class="stat-val" id="statRound">第0天</span></span>
  <span class="stat-item">👥 <span class="stat-label">存活</span> <span class="stat-val" id="statAlive">—人</span></span>
  <span class="stat-item">👻 <span class="stat-label">鬼</span> <span class="stat-val" id="statGhosts">0只</span></span>
  <span class="stat-item" style="margin-left:auto;font-size:0.65rem;color:var(--text-muted);">📊 实时数据 · 共享状态</span>
</footer>

<!-- ═══════════ IDENTITY OVERLAY ═══════════ -->
<div class="id-overlay" id="identityOverlay" style="display:none;">
  <div class="id-card">
    <h2>🏙️ 选择你的身份</h2>
    <p class="id-subtitle">不同的身份将赋予你不同的工具箱界面体验</p>
    <div class="id-options">
      <div class="id-option id-mayor" onclick="selectIdentity('mayor')">
        <span class="ido-icon">👑</span>
        <div class="ido-name">市长登入</div>
        <div class="ido-desc">总览全局，掌控城市命脉</div>
        <div class="ido-edition">日报版式 · 简明记录</div>
      </div>
      <div class="id-option id-reporter" onclick="selectIdentity('reporter')">
        <span class="ido-icon">📰</span>
        <div class="ido-name">记者登入</div>
        <div class="ido-desc">独家视角，记录真相</div>
        <div class="ido-edition">日报版式 · 复古报纸</div>
      </div>
      <div class="id-option id-sheriff" onclick="selectIdentity('sheriff')">
        <span class="ido-icon">🛡️</span>
        <div class="ido-name">警长登入</div>
        <div class="ido-desc">户籍管理，严密监视</div>
        <div class="ido-edition">日报版式 · 户籍登记</div>
      </div>
    </div>
    <p class="id-switch-hint">💡 随时可点击顶部身份徽章切换身份</p>
  </div>
</div>

<!-- ═══════════ SCRIPTS ═══════════ -->
<script src="../js/data.js?v=2026071116"></script>
<script>
// ============================================================
// GLOBAL STATE
// ============================================================
let activeTab = 'map';

// Rule board state
let rbPoolFilter = 'all';
let rbZones = { all: [], human: [], ghost: [], erased: [] };
let rbAllRules = [];

// Shared state keys
const DAILY_KEY = 'dawn_citizen_daily_v1';
const SETTLEMENT_KEY = 'dawn_settlement_v1';
const IDENTITY_KEY = 'dawn_dashboard_identity';

// Identity system
const IDENTITIES = {
  mayor: {
    icon: '👑', label: '市长端', cssClass: 'id-mayor',
    desc: '总览全局 · 简明记录',
    dailySrc: 'citizen-daily.html',
    dailyLabel: '日报V1 · 简明版'
  },
  reporter: {
    icon: '📰', label: '记者端', cssClass: 'id-reporter',
    desc: '独家视角 · 复古报纸',
    dailySrc: 'citizen-daily-2.html',
    dailyLabel: '日报V2 · 报纸版'
  },
  sheriff: {
    icon: '🛡️', label: '警长端', cssClass: 'id-sheriff',
    desc: '户籍管理 · 严密监视',
    dailySrc: 'citizen-daily-3.html',
    dailyLabel: '日报V3 · 户籍版'
  }
};
let currentIdentity = 'mayor';

// ============================================================
// IDENTITY SYSTEM
// ============================================================
function loadIdentity() {
  try {
    const saved = localStorage.getItem(IDENTITY_KEY);
    if (saved && IDENTITIES[saved]) return saved;
  } catch(e) {}
  return null;
}

function saveIdentity(type) {
  try { localStorage.setItem(IDENTITY_KEY, type); } catch(e) {}
}

function showIdentityPicker() {
  const overlay = document.getElementById('identityOverlay');
  if (overlay) overlay.style.display = 'flex';
}

function hideIdentityPicker() {
  const overlay = document.getElementById('identityOverlay');
  if (overlay) overlay.style.display = 'none';
}

function selectIdentity(type) {
  if (!IDENTITIES[type]) return;
  currentIdentity = type;
  saveIdentity(type);
  hideIdentityPicker();
  updateIdentityUI();
}

function updateIdentityUI() {
  const id = IDENTITIES[currentIdentity];
  if (!id) return;

  // Update badge
  const badge = document.getElementById('identityBadge');
  if (badge) {
    badge.textContent = id.icon + ' ' + id.label;
    badge.className = 'db-mode-badge ' + id.cssClass;
    badge.title = '点击切换身份（当前：' + id.label + '）';
    badge.style.cursor = 'pointer';
  }

  // Update daily tab label
  const dailyTab = document.querySelector('.db-tab[data-tab="daily"]');
  if (dailyTab) {
    dailyTab.textContent = '📰 ' + id.dailyLabel;
  }

  // Update daily iframe source
  const dailyIframe = document.querySelector('#mod-daily iframe');
  if (dailyIframe) {
    dailyIframe.src = id.dailySrc;
  }

  // Update dashboard header title
  const dashH2 = document.querySelector('#mod-dash h2');
  if (dashH2) {
    // Will be refreshed on next updateDashboard call
  }
}

// ============================================================
// INIT
// ============================================================
function init() {
  // Identity check
  const savedId = loadIdentity();
  if (savedId) {
    currentIdentity = savedId;
    updateIdentityUI();
  } else {
    // First visit — show identity picker
    showIdentityPicker();
    currentIdentity = 'mayor'; // default fallback
    updateIdentityUI();
  }

  // Close overlay on backdrop click
  const overlay = document.getElementById('identityOverlay');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) hideIdentityPicker();
    });
  }

  // Keyboard: ESC to close identity overlay
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const ov = document.getElementById('identityOverlay');
      if (ov && ov.style.display === 'flex') {
        hideIdentityPicker();
      }
    }
  });

  // Tab clicks
  document.querySelectorAll('.db-tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  // Initialize modules
  initRules();
  updateDashboard();
  updateStatusBar();
}

function switchTab(tabName) {
  activeTab = tabName;
  document.querySelectorAll('.db-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.db-module').forEach(m => m.classList.remove('active'));

  const tabBtn = document.querySelector(`.db-tab[data-tab="${tabName}"]`);
  const modEl = document.getElementById(`mod-${tabName}`);

  if (tabBtn) tabBtn.classList.add('active');
  if (modEl) modEl.classList.add('active');

  // Refresh module on switch
  if (tabName === 'rules') renderRuleBoard();
  if (tabName === 'dash') updateDashboard();
  // Ensure daily iframe uses current identity
  if (tabName === 'daily') {
    const dailyIframe = document.querySelector('#mod-daily iframe');
    const id = IDENTITIES[currentIdentity];
    if (dailyIframe && id && dailyIframe.src !== id.dailySrc) {
      dailyIframe.src = id.dailySrc;
    }
  }
}

// ============================================================
// QUICK DASHBOARD
// ============================================================
function loadDailyState() {
  try {
    const raw = localStorage.getItem(DAILY_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function loadSettlement() {
  try {
    const raw = localStorage.getItem(SETTLEMENT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function isGhost(c) {
  if (!c) return false;
  return c.status === 'ghost' || c.status === 'transferred' || c.health <= 0 || c.sanity <= 0;
}
function isDead(c) {
  if (!c) return true;
  return c.status === 'transferred' || (c.health <= 0 && c.sanity <= 0);
}

function updateDashboard() {
  const state = loadDailyState();
  const settlement = loadSettlement();
  const container = document.getElementById('dashContent');

  if (!state || !state.gameStarted || !state.citizens || state.citizens.length === 0) {
    container.innerHTML = `
      <div class="dash-empty">
        <div class="dash-empty-icon">📋</div>
        <p>暂无游戏数据</p>
        <p style="font-size:0.7rem;color:var(--text-muted);">请先在"市民日报"中创建一局新游戏</p>
        <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="document.querySelector('.db-tab[data-tab=daily]').click()">📰 前往市民日报</button>
      </div>
    `;
    updateStatusBar();
    return;
  }

  const citizens = state.citizens;
  const alive = citizens.filter(c => !isDead(c) && c.status === 'alive');
  const ghosts = citizens.filter(c => isGhost(c) && !isDead(c));
  const dead = citizens.filter(c => isDead(c));
  const currentDay = state.currentDay;
  const gameEnded = settlement && settlement.gameEnded;

  // Emoji map
  const emojiMap = {
    'ch_001': '😄', 'ch_002': '🍀', 'ch_003': '🤕', 'ch_004': '🧠',
    'ch_005': '😶', 'ch_006': '💼', 'ch_007': '👁️', 'ch_008': '👑',
    'ch_009': '🛵', 'ch_010': '🔍', 'ch_011': '📋', 'ch_012': '✊'
  };

  const identity = IDENTITIES[currentIdentity];
  let html = `<h2>📊 ${identity.icon} ${identity.label} · 游戏仪表盘` + (gameEnded ? ' <span style="color:var(--color-whisper-glow);font-size:0.7rem;">[已终局]</span>' : '') + '</h2>';

  // Stat cards
  html += '<div class="dash-stat-row">';
  html += `<div class="dash-stat-card gold"><div class="dsc-val">第${currentDay}天</div><div class="dsc-label">当前回合 / 共12回合</div></div>`;
  html += `<div class="dash-stat-card info"><div class="dsc-val">${alive.length}</div><div class="dsc-label">存活市民</div></div>`;
  html += `<div class="dash-stat-card warn"><div class="dsc-val">${ghosts.length}</div><div class="dsc-label">鬼魂</div></div>`;
  html += `<div class="dash-stat-card"><div class="dsc-val">${dead.length}</div><div class="dsc-label">已死亡/转移</div></div>`;
  html += '</div>';

  // Citizen roster
  html += '<div class="dash-section"><h3>👥 市民名册</h3><div class="dash-roster">';
  citizens.forEach(c => {
    const emoji = emojiMap[c.id] || '👤';
    const deadFlag = isDead(c);
    const ghostFlag = isGhost(c) && !deadFlag;
    let cls = 'alive';
    let marker = '';
    if (deadFlag) { cls = 'dead'; marker = ' ⚰️'; }
    else if (ghostFlag) { cls = 'ghost'; marker = ' 👻'; }
    html += `<span class="dash-citizen-tag ${cls}">${emoji} ${c.name}${marker} <span class="dct-stat">❤️${c.health} 🧠${c.sanity}</span></span>`;
  });
  html += '</div></div>';

  // Settlement summary
  if (settlement && settlement.rounds && Object.keys(settlement.rounds).length > 0) {
    html += '<div class="dash-section"><h3>📋 最近结算</h3>';
    const roundKeys = Object.keys(settlement.rounds).sort((a, b) => Number(b) - Number(a));
    const lastRound = settlement.rounds[roundKeys[0]];
    if (lastRound) {
      html += `<div class="dash-settle-block" style="font-size:0.7rem;color:var(--text-secondary);border-radius:var(--radius-sm);padding:8px 12px;">`;
      html += `<strong>${lastRound.day}</strong> — ${lastRound.summary}`;
      html += `</div>`;
    }
    html += '</div>';
  }

  // Game end info
  if (gameEnded) {
    html += '<div class="dash-section">';
    html += '<h3>🏁 终局信息</h3>';
    html += `<div class="dash-end-block" style="font-size:0.7rem;color:var(--color-whisper-glow);border-radius:var(--radius-sm);padding:8px 12px;">`;
    html += `原因: ${settlement.endReason === 'all_dead' ? '所有市民已死亡或转移' : '市长手动终局'}`;
    if (settlement.endedAt) {
      html += ` | 时间: ${new Date(settlement.endedAt).toLocaleString('zh-CN')}`;
    }
    html += `</div></div>`;
  }

  // Quick links
  html += '<div class="dash-section"><h3>🔗 快捷工具</h3><div class="dash-links">';
  html += `<a class="dash-link-card" href="citizen-daily.html" target="_blank"><span class="dlc-icon">📰</span><div class="dlc-info"><div class="dlc-title">市民日报 v1</div><div class="dlc-desc">基础宣言记录工具</div></div></a>`;
  html += `<a class="dash-link-card" href="citizen-daily-2.html" target="_blank"><span class="dlc-icon">🗞️</span><div class="dlc-info"><div class="dlc-title">市民日报 v2</div><div class="dlc-desc">复古报纸风格</div></div></a>`;
  html += `<a class="dash-link-card" href="citizen-daily-3.html" target="_blank"><span class="dlc-icon">📋</span><div class="dlc-info"><div class="dlc-title">户籍管理系统</div><div class="dlc-desc">市民状态变更登记</div></div></a>`;
  html += `<a class="dash-link-card" href="rule-board.html" target="_blank"><span class="dlc-icon">📜</span><div class="dlc-info"><div class="dlc-title">公开规则板</div><div class="dlc-desc">独立规则管理页面</div></div></a>`;
  html += `<a class="dash-link-card" href="../ai-mayor.html" target="_blank"><span class="dlc-icon">🤖</span><div class="dlc-info"><div class="dlc-title">AI市长对话</div><div class="dlc-desc">AI叙事模拟</div></div></a>`;
  html += `</div></div>`;

  container.innerHTML = html;
  updateStatusBar();
}

// ============================================================
// STATUS BAR
// ============================================================
function updateStatusBar() {
  const state = loadDailyState();
  const settlement = loadSettlement();

  if (!state || !state.gameStarted) {
    document.getElementById('statRound').textContent = '—';
    document.getElementById('statAlive').textContent = '—';
    document.getElementById('statGhosts').textContent = '—';
    return;
  }

  const citizens = state.citizens || [];
  const alive = citizens.filter(c => !isDead(c) && c.status === 'alive');
  const ghosts = citizens.filter(c => isGhost(c) && !isDead(c));

  document.getElementById('statRound').textContent = `第${state.currentDay}天`;
  document.getElementById('statAlive').textContent = `${alive.length}人`;
  document.getElementById('statGhosts').textContent = `${ghosts.length}只`;
}

// ============================================================
// RULE BOARD MODULE
// ============================================================
function getRuleImagePath(card) {
  const name = card.name;
  const BASE = '../';
  // 普通规则: 规则卡/规则卡_T1-01.png
  if (name.startsWith('规则 ')) {
    const code = name.replace('规则 ', '');
    return BASE + 'images/cards/规则卡/规则卡_' + code + '.png';
  }
  // 特殊规则: r_031→S-01A, r_032→S-01B, r_033→S-02A, ...
  if (card.id && card.id.startsWith('r_')) {
    const num = parseInt(card.id.split('_')[1]);
    if (num >= 31 && num <= 54) {
      const rulesArr = CARD_DB.rules || [];
      const idx = rulesArr.findIndex(r => r.id === card.id);
      if (idx >= 30) {
        const offset = idx - 30;
        const pairNum = String(Math.floor(offset / 2) + 1).padStart(2, '0');
        const letter = offset % 2 === 0 ? 'A' : 'B';
        return BASE + 'images/cards/规则卡/规则卡_S-' + pairNum + letter + '.png';
      }
    }
  }
  return BASE + 'images/cards/规则卡/规则卡_T1-01.png';
}

function buildAllRules() {
  const rules = [];
  if (typeof CARD_DB !== 'undefined' && CARD_DB.rules) {
    CARD_DB.rules.forEach(card => {
      rules.push({ ...card, _inPool: true });
    });
  }
  return rules;
}

function initRules() {
  rbAllRules = buildAllRules();
  // Load from localStorage
  try {
    const saved = localStorage.getItem('lmzh_rule_board');
    if (saved) {
      const data = JSON.parse(saved);
      rbZones = data.zones || { all: [], human: [], ghost: [], erased: [] };
      // Remove zoned cards from pool
      const zonedIds = new Set();
      Object.values(rbZones).forEach(arr => arr.forEach(c => zonedIds.add(c.id)));
      rbAllRules.forEach(c => { if (zonedIds.has(c.id)) c._inPool = false; });
    }
  } catch(e) {}
  renderRuleBoard();
}

function renderRuleBoard() {
  // Filter tabs
  document.querySelectorAll('#rbPoolPanel .rb-pool-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.filter === rbPoolFilter);
  });

  // Pool cards
  let poolCards = rbAllRules.filter(c => c._inPool !== false);
  if (rbPoolFilter === '普通') poolCards = poolCards.filter(c => c.level && c.level.includes('T'));
  if (rbPoolFilter === '特殊') poolCards = poolCards.filter(c => !c.level || !c.level.includes('T'));

  const poolEl = document.getElementById('rbPoolCards');
  document.getElementById('poolCount').textContent = `(${poolCards.length})`;

  if (poolCards.length === 0) {
    poolEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:0.75rem;">卡池已空</div>';
  } else {
    poolEl.innerHTML = poolCards.map(c => {
      const imgPath = getRuleImagePath(c);
      return `<div class="rb-card-item rb-draggable" data-id="${c.id}" 
        draggable="true" 
        ondragstart="onDragStart(event)" 
        onclick="selectPoolCard(this)">
        <div class="rbci-img"><img src="${imgPath}" alt="${c.name}" onerror="this.style.display='none'"></div>
        <div class="rbci-name">${c.name}</div>
      </div>`;
    }).join('');
  }

  // Add drag listeners (always mayor)
  document.querySelectorAll('#rbPoolCards .rb-card-item').forEach(el => {
    el.addEventListener('dragstart', onDragStart);
  });

  // Pool tab clicks
  document.querySelectorAll('#rbPoolPanel .rb-pool-tab').forEach(tab => {
    tab.onclick = () => {
      rbPoolFilter = tab.dataset.filter;
      renderRuleBoard();
    };
  });

  // Zone cards
  ['all','human','ghost','erased'].forEach(zone => {
    const zoneEl = document.getElementById('zone' + zone.charAt(0).toUpperCase() + zone.slice(1));
    const cards = rbZones[zone] || [];
    if (cards.length === 0) {
      zoneEl.innerHTML = '<span class="empty-hint">拖入规则卡</span>';
    } else {
      zoneEl.innerHTML = cards.map(c => {
        const imgPath = getRuleImagePath(c);
        return `<div class="rb-zone-card" data-id="${c.id}" data-zone="${zone}">
          <img src="${imgPath}" alt="${c.name}" onerror="this.style.display='none'">
          <button class="zcard-return show" onclick="returnCardToPool('${c.id}','${zone}')">↩ 返回</button>
        </div>`;
      }).join('');
    }
  });

  // Drop zones (always mayor)
  document.querySelectorAll('.rb-zone').forEach(zone => {
    zone.addEventListener('dragover', onDragOver);
    zone.addEventListener('drop', onDrop);
  });

  // Save
  saveRuleBoard();
}

function saveRuleBoard() {
  try {
    localStorage.setItem('lmzh_rule_board', JSON.stringify({ zones: rbZones }));
  } catch(e) {}
}

// Drag & Drop
let dragCardId = null;
function onDragStart(e) {
  dragCardId = e.target.closest('.rb-card-item')?.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDrop(e) {
  e.preventDefault();
  if (!dragCardId) return;
  const zoneEl = e.target.closest('.rb-zone');
  if (!zoneEl) return;
  const zoneName = zoneEl.dataset.zone;

  // Find card in pool
  const cardIdx = rbAllRules.findIndex(c => c.id === dragCardId && c._inPool !== false);
  if (cardIdx === -1) return;

  const card = rbAllRules[cardIdx];
  card._inPool = false;
  if (!rbZones[zoneName]) rbZones[zoneName] = [];
  rbZones[zoneName].push({ id: card.id, name: card.name });
  dragCardId = null;
  renderRuleBoard();
}

// Mobile: select pool card
let selectedPoolCard = null;
function selectPoolCard(el) {
  document.querySelectorAll('#rbPoolCards .rb-card-item').forEach(c => c.classList.remove('selected'));
  if (selectedPoolCard === el.dataset.id) {
    selectedPoolCard = null;
  } else {
    selectedPoolCard = el.dataset.id;
    el.classList.add('selected');
    // Show zone picker
    showZonePicker(el.dataset.id);
  }
}

function showZonePicker(cardId) {
  const zones = ['all','human','ghost','erased'];
  const choice = prompt('选择分区：\n1. 影响全体\n2. 只影响人\n3. 只影响鬼\n4. 已被抹除\n\n输入数字 1-4：');
  if (!choice) { selectedPoolCard = null; renderRuleBoard(); return; }
  const idx = parseInt(choice) - 1;
  if (idx < 0 || idx > 3) { selectedPoolCard = null; renderRuleBoard(); return; }

  const cardIdx = rbAllRules.findIndex(c => c.id === cardId && c._inPool !== false);
  if (cardIdx === -1) { renderRuleBoard(); return; }

  const card = rbAllRules[cardIdx];
  card._inPool = false;
  if (!rbZones[zones[idx]]) rbZones[zones[idx]] = [];
  rbZones[zones[idx]].push({ id: card.id, name: card.name });
  selectedPoolCard = null;
  renderRuleBoard();
}

function returnCardToPool(cardId, zoneName) {
  const zoneArr = rbZones[zoneName];
  if (!zoneArr) return;
  const idx = zoneArr.findIndex(c => c.id === cardId);
  if (idx === -1) return;
  zoneArr.splice(idx, 1);

  const card = rbAllRules.find(c => c.id === cardId);
  if (card) card._inPool = true;
  renderRuleBoard();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', init);
</script>
