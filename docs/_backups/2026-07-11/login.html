<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 — 黎明之后</title>
<link rel="stylesheet" href="css/main.css?v=2026070921">
<style>
/* ===== 登录页专属样式 ===== */
.login-page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-deep);
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(142,68,173,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 70%, rgba(192,57,43,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 60%, rgba(46,134,193,0.05) 0%, transparent 50%);
  padding: var(--space-lg);
}

/* 顶部品牌区 */
.login-brand {
  text-align: center;
  margin-bottom: var(--space-xl);
}
.login-brand h1 {
  font-size: 2.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--color-whisper) 30%, var(--color-rule-glow) 60%, var(--text-primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: var(--space-xs);
}
.login-brand .subtitle {
  color: var(--text-muted);
  font-size: 0.9rem;
  letter-spacing: 0.15em;
}

/* 登录卡片 */
.login-card {
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  border: 1px solid rgba(255,255,255,0.06);
  width: 100%;
  max-width: 420px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}

/* 选项卡 */
.login-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.login-tab {
  flex: 1;
  padding: var(--space-md);
  text-align: center;
  font-size: 0.95rem;
  color: var(--text-muted);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
}
.login-tab:hover { color: var(--text-secondary); }
.login-tab.active {
  color: var(--text-primary);
  font-weight: 600;
}
.login-tab.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 2px;
  background: var(--color-whisper);
  border-radius: 1px;
}
.login-tab.mayor-tab.active::after { background: var(--color-rule-glow); }
.login-tab.citizen-tab.active::after { background: var(--color-counter); }

/* 面板 */
.login-panel { display: none; padding: var(--space-xl); }
.login-panel.active { display: block; }

/* ===== 市长面板 ===== */
.mayor-options {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}
.mayor-btn {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-lg);
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-lg);
  color: var(--text-primary);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.mayor-btn:hover {
  background: var(--bg-hover);
  border-color: var(--color-rule-glow);
  transform: translateY(-1px);
}
.mayor-btn .icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.mayor-btn .icon.real { background: rgba(212,160,23,0.15); }
.mayor-btn .icon.ai { background: rgba(142,68,173,0.15); }
.mayor-btn .info { flex: 1; }
.mayor-btn .info .title { font-weight: 600; font-size: 1.05rem; }
.mayor-btn .info .desc { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }
.mayor-btn .arrow { color: var(--text-muted); font-size: 1.2rem; }

.mayor-btn.ai-disabled {
  opacity: 0.45;
  cursor: not-allowed;
  position: relative;
}
.mayor-btn.ai-disabled:hover {
  background: var(--bg-elevated);
  border-color: rgba(255,255,255,0.08);
  transform: none;
}
.mayor-badge {
  position: absolute;
  top: -6px;
  right: 12px;
  background: var(--bg-hover);
  color: var(--text-muted);
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
}

/* ===== 市民面板 ===== */
.citizen-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}

/* 头像上传 */
.avatar-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
}
.avatar-preview {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 2px dashed rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.2s;
  position: relative;
}
.avatar-preview:hover { border-color: var(--color-counter); }
.avatar-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar-preview .placeholder {
  color: var(--text-muted);
  font-size: 0.75rem;
  text-align: center;
  line-height: 1.3;
}
.avatar-preview.has-image .placeholder { display: none; }
.avatar-hint {
  color: var(--text-muted);
  font-size: 0.75rem;
}

/* 表单 */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-group label {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
}
.form-input {
  padding: 12px 14px;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 0.95rem;
  transition: border-color 0.2s;
  outline: none;
}
.form-input:focus { border-color: var(--color-counter); }
.form-input::placeholder { color: var(--text-muted); }

/* 阵营选择 */
.faction-select {
  display: flex;
  gap: var(--space-sm);
}
.faction-option {
  flex: 1;
  padding: 12px;
  text-align: center;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.9rem;
}
.faction-option:hover { border-color: rgba(255,255,255,0.2); }
.faction-option.active {
  border-color: var(--color-counter);
  color: var(--color-counter-glow);
  background: rgba(46,134,193,0.1);
}

/* 登录按钮 */
.submit-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--color-counter) 0%, #2471a3 100%);
  border: none;
  border-radius: var(--radius-md);
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: var(--space-sm);
}
.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(46,134,193,0.3);
}
.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* 角色选择 */
.char-section { margin-top: 4px; }
.char-section-label {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 8px;
}
.char-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  max-height: 260px;
  overflow-y: auto;
  padding-right: 4px;
}
.char-grid::-webkit-scrollbar { width: 4px; }
.char-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.char-option {
  padding: 10px 12px;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.char-option:hover { border-color: rgba(255,255,255,0.18); background: var(--bg-hover); }
.char-option.selected {
  border-color: var(--color-counter);
  background: rgba(46,134,193,0.12);
  box-shadow: 0 0 8px rgba(46,134,193,0.15);
}
.char-option .char-cat {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  opacity: 0.8;
}
.char-option .char-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.2;
}
.char-option .char-stats {
  display: flex;
  gap: 10px;
  font-size: 0.7rem;
  color: var(--text-muted);
}
.char-option .char-stats .hp { color: #e74c3c; }
.char-option .char-stats .sp { color: #3498db; }
.char-cat-fate  { color: #c89ef2; }
.char-cat-atk   { color: #e74c3c; }
.char-cat-intel { color: #3498db; }
.char-cat-self  { color: #2ecc71; }
.char-cat-res   { color: #f1c40f; }

/* 错误提示 */
.form-error {
  color: var(--color-whisper-glow);
  font-size: 0.8rem;
  min-height: 1.2em;
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  .login-brand h1 { font-size: 1.8rem; }
  .login-card { border-radius: var(--radius-lg); }
  .login-panel { padding: var(--space-lg) var(--space-md); }
  .mayor-btn { padding: var(--space-md); }
}
</style>
</head>
<body class="login-page">

<!-- 品牌 -->
<div class="login-brand">
  <h1>黎明之后</h1>
  <p class="subtitle">规则怪谈 · 推理反击</p>
</div>

<!-- 登录卡片 -->
<div class="login-card">
  <div class="login-tabs">
    <button class="login-tab mayor-tab active" data-tab="mayor">🏛️ 市长登入</button>
    <button class="login-tab citizen-tab" data-tab="citizen">👤 市民登入</button>
  </div>

  <!-- 市长面板 -->
  <div class="login-panel active" id="panel-mayor">
    <div class="mayor-options">
      <button class="mayor-btn" onclick="loginAsMayor('real')">
        <div class="icon real">🏛️</div>
        <div class="info">
          <div class="title">真人市长登入</div>
          <div class="desc">解锁工具箱 · 全图视野 · 回合管理 · 牌库中枢</div>
        </div>
        <div class="arrow">→</div>
      </button>

      <button class="mayor-btn ai-disabled" disabled title="AI 市长功能尚未开放，敬请期待">
        <div class="icon ai">🤖</div>
        <div class="info">
          <div class="title">AI 市长登入</div>
          <div class="desc">AI 接管煞鬼故事生成与规则管理</div>
        </div>
        <div class="arrow">→</div>
        <div class="mayor-badge">即将开放</div>
      </button>
    </div>
  </div>

  <!-- 市民面板 -->
  <div class="login-panel" id="panel-citizen">
    <form class="citizen-form" onsubmit="return loginAsCitizen(event)">
      <!-- 头像上传 -->
      <div class="avatar-section">
        <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">
          <span class="placeholder">点击上传<br>头像</span>
        </div>
        <span class="avatar-hint">可选 · 本地图片不会被上传到任何服务器</span>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatar(event)">
      </div>

      <!-- 用户名 -->
      <div class="form-group">
        <label for="username">用户名</label>
        <input class="form-input" id="username" type="text" placeholder="输入你的名字…" maxlength="16" autocomplete="off">
      </div>

      <!-- 角色选择 -->
      <div class="char-section">
        <div class="char-section-label">选择你的幸存者身份 <span style="color:var(--text-muted);font-weight:400;">（12选1）</span></div>
        <div class="char-grid" id="charGrid">
          <!-- JS动态生成 -->
        </div>
      </div>

      <!-- 错误提示 -->
      <div class="form-error" id="formError"></div>

      <!-- 提交 -->
      <button class="submit-btn" type="submit" id="submitBtn">进入游戏</button>
    </form>
  </div>
</div>

<!-- 底部 -->
<div style="position:fixed;bottom:16px;color:var(--text-muted);font-size:0.7rem;text-align:center;width:100%;left:0;pointer-events:none;">
  本页面所有数据存储在本地浏览器 · 不会上传至任何服务器
</div>

<script>
// ===== 角色数据（12名幸存者）=====
var CHARACTERS = [
  { id:'ch_001', name:'乐天派幸存者', category:'命运操控者', health:7, sanity:7, catClass:'char-cat-fate' },
  { id:'ch_002', name:'天生幸运儿',   category:'命运操控者', health:6, sanity:6, catClass:'char-cat-fate' },
  { id:'ch_003', name:'倒霉体质者',   category:'命运操控者', health:6, sanity:6, catClass:'char-cat-fate' },
  { id:'ch_004', name:'逻辑严谨理科生', category:'攻击者',     health:6, sanity:6, catClass:'char-cat-atk' },
  { id:'ch_005', name:'内向社恐大学生', category:'攻击者',     health:6, sanity:6, catClass:'char-cat-atk' },
  { id:'ch_006', name:'街道社区主任',   category:'攻击者',     health:6, sanity:6, catClass:'char-cat-atk' },
  { id:'ch_007', name:'灵异研究者',     category:'情报型',     health:6, sanity:6, catClass:'char-cat-intel' },
  { id:'ch_008', name:'法医侦探',       category:'情报型',     health:6, sanity:7, catClass:'char-cat-intel' },
  { id:'ch_009', name:'沉寂的上班族',   category:'自保型',     health:6, sanity:6, catClass:'char-cat-self' },
  { id:'ch_010', name:'整顿末世零零后', category:'自保型',     health:6, sanity:6, catClass:'char-cat-self' },
  { id:'ch_011', name:'豪门之后',       category:'资源型',     health:3, sanity:3, catClass:'char-cat-res' },
  { id:'ch_012', name:'外卖单王',       category:'资源型',     health:5, sanity:6, catClass:'char-cat-res' }
];
var selectedCharId = null;

function buildCharGrid() {
  var grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  CHARACTERS.forEach(function(ch) {
    var opt = document.createElement('div');
    opt.className = 'char-option';
    opt.dataset.charId = ch.id;
    opt.innerHTML =
      '<span class="char-cat ' + ch.catClass + '">' + ch.category + '</span>' +
      '<span class="char-name">' + ch.name + '</span>' +
      '<span class="char-stats"><span class="hp">❤ ' + ch.health + '</span><span class="sp">💙 ' + ch.sanity + '</span></span>';
    opt.addEventListener('click', function() { selectCharacter(ch.id); });
    grid.appendChild(opt);
  });
}

function selectCharacter(charId) {
  selectedCharId = charId;
  document.querySelectorAll('.char-option').forEach(function(el) {
    el.classList.toggle('selected', el.dataset.charId === charId);
  });
  // 清除错误
  document.getElementById('formError').textContent = '';
}

// ===== 选项卡切换 =====
document.querySelectorAll('.login-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.login-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ===== 头像处理 =====
function handleAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;

  const preview = document.getElementById('avatarPreview');

  // 限制文件大小 2MB
  if (file.size > 2 * 1024 * 1024) {
    showError('图片太大，请选择小于 2MB 的图片');
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // 裁剪为正方形（取中心）
      const size = Math.min(img.width, img.height);
      const sx = (img.width - size) / 2;
      const sy = (img.height - size) / 2;

      const canvas = document.createElement('canvas');
      canvas.width = 200;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);

      const base64 = canvas.toDataURL('image/jpeg', 0.85);

      // 预览
      preview.innerHTML = '';
      const thumb = document.createElement('img');
      thumb.src = base64;
      preview.appendChild(thumb);
      preview.classList.add('has-image');
      preview.dataset.avatarData = base64;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== 市长登录 =====
function loginAsMayor(type) {
  const session = {
    role: 'mayor',
    type: type, // 'real' or 'ai'
    loginTime: Date.now()
  };
  localStorage.setItem('dawn_session', JSON.stringify(session));
  // 跳转到市长面板
  window.location.href = 'toolbox/dashboard.html';
}

// ===== 市民登录 =====
function loginAsCitizen(event) {
  event.preventDefault();
  var username = document.getElementById('username').value.trim();
  var avatar = document.getElementById('avatarPreview').dataset.avatarData || '';

  // 验证
  if (!username) {
    showError('请输入用户名');
    return false;
  }
  if (username.length < 1 || username.length > 16) {
    showError('用户名长度 1-16 个字符');
    return false;
  }
  if (!selectedCharId) {
    showError('请选择一个幸存者身份');
    return false;
  }

  var character = null;
  for (var i = 0; i < CHARACTERS.length; i++) {
    if (CHARACTERS[i].id === selectedCharId) {
      character = { id: CHARACTERS[i].id, name: CHARACTERS[i].name, category: CHARACTERS[i].category, health: CHARACTERS[i].health, sanity: CHARACTERS[i].sanity, img: '角色卡_' + CHARACTERS[i].category + '_' + CHARACTERS[i].name + '.png' };
      break;
    }
  }

  var session = {
    role: 'citizen',
    username: username,
    status: 'citizen',
    avatar: avatar,
    character: character,
    loginTime: Date.now()
  };
  localStorage.setItem('dawn_session', JSON.stringify(session));
  // 跳转到市民面板
  window.location.href = 'citizen.html';
  return false;
}

function showError(msg) {
  const el = document.getElementById('formError');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 3000);
}

// ===== 页面加载时检查已有会话 =====
(function() {
  // 构建角色选择网格
  buildCharGrid();

  var session = localStorage.getItem('dawn_session');
  if (!session) return;
  try {
    const data = JSON.parse(session);
    // 如果已有会话且是今天，自动跳转
    const age = Date.now() - data.loginTime;
    if (age < 24 * 60 * 60 * 1000) {
      if (data.role === 'mayor') {
        window.location.href = 'toolbox/dashboard.html';
      } else {
        window.location.href = 'citizen.html';
      }
    }
  } catch(e) {}
})();
</script>

</body>
</html>
